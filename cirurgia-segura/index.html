<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c81">
  <meta name="description" content="Protótipo de apoio à Cirurgia Segura — checklist OMS digital + indicadores. Ambiente de simulação com dados fictícios.">
  <title>Cirurgia Segura — Protótipo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sim-banner" role="status">⚠ SIMULAÇÃO — DADOS FICTÍCIOS</div>
  <header id="topbar" hidden>
    <div class="topbar-inner">
      <span id="topbar-title">Cirurgia Segura</span>
      <nav id="mainnav" aria-label="Navegação principal"></nav>
      <span class="topbar-spacer"></span>
      <span id="net-indicator" aria-live="polite"></span>
      <span id="topbar-user"></span>
      <button id="btn-lock" class="icon-btn" title="Bloquear sessão" aria-label="Bloquear sessão">🔒</button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <nav id="tabbar" aria-label="Navegação" hidden></nav>
  <div id="sheet-backdrop" hidden></div>
  <div id="bottom-sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="success-overlay" aria-hidden="true" hidden><div class="success-check">✓</div><div class="success-msg"></div></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
